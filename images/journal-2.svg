<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <!-- Sky -->
  <rect width="160" height="70" fill="#93c5fd"/>
  <!-- Soft Clouds -->
  <ellipse cx="40" cy="20" rx="30" ry="8" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="120" cy="25" rx="35" ry="10" fill="#ffffff" opacity="0.6"/>
  <!-- Green Grass Horizon -->
  <rect y="65" width="160" height="35" fill="#4ade80"/>
  <path d="M 0 65 Q 80 60 160 65 L 160 100 L 0 100 Z" fill="#22c55e"/>

  <!-- Stepped Pyramid Structure -->
  <!-- Base layer -->
  <polygon points="35,74 125,74 120,64 40,64" fill="#a8a29e"/>
  <!-- Tier 2 -->
  <polygon points="43,64 117,64 112,54 48,54" fill="#b7b0ab"/>
  <!-- Tier 3 -->
  <polygon points="51,54 109,54 105,44 55,44" fill="#c7c1bb"/>
  <!-- Tier 4 -->
  <polygon points="58,44 102,44 98,34 62,34" fill="#d6d1cb"/>
  <!-- Top temple sanctuary -->
  <rect x="68" y="27" width="24" height="7" fill="#e7e2dc"/>
  <!-- Doorway -->
  <rect x="77" y="29" width="6" height="5" fill="#57534e"/>

  <!-- Central staircase -->
  <polygon points="72,74 88,74 84,34 76,34" fill="#8c857f"/>
  <g stroke="#736d67" stroke-width="0.8">
    <line x1="73" y1="69" x2="87" y2="69"/>
    <line x1="74" y1="64" x2="86" y2="64"/>
    <line x1="75" y1="59" x2="85" y2="59"/>
    <line x1="76" y1="54" x2="84" y2="54"/>
    <line x1="77" y1="49" x2="83" y2="49"/>
    <line x1="78" y1="44" x2="82" y2="44"/>
    <line x1="79" y1="39" x2="81" y2="39"/>
  </g>
</svg>
