  <ellipse cx="65" cy="48" rx="7" ry="9" fill="#fb923c"/>
  <ellipse cx="65" cy="72" rx="7" ry="9" fill="#facc15"/>

  <!-- Lanterns on String 4 -->
  <ellipse cx="85" cy="34" rx="7" ry="9" fill="#fbbf24"/>
