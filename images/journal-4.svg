<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <!-- Dark night background -->
  <rect width="160" height="100" fill="#1e293b"/>
  
  <!-- Hanging strings -->
  <line x1="25" y1="0" x2="25" y2="100" stroke="#475569" stroke-width="0.8"/>
  <line x1="45" y1="0" x2="45" y2="100" stroke="#475569" stroke-width="0.8"/>
  <line x1="65" y1="0" x2="65" y2="100" stroke="#475569" stroke-width="0.8"/>
  <line x1="85" y1="0" x2="85" y2="100" stroke="#475569" stroke-width="0.8"/>
  <line x1="105" y1="0" x2="105" y2="100" stroke="#475569" stroke-width="0.8"/>
  <line x1="125" y1="0" x2="125" y2="100" stroke="#475569" stroke-width="0.8"/>
  <line x1="145" y1="0" x2="145" y2="100" stroke="#475569" stroke-width="0.8"/>

  <!-- Lanterns on String 1 -->
  <ellipse cx="25" cy="22" rx="7" ry="9" fill="#f97316"/>
  <ellipse cx="25" cy="46" rx="7" ry="9" fill="#ef4444"/>
  <ellipse cx="25" cy="70" rx="7" ry="9" fill="#eab308"/>

